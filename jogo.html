<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<title>Survival Souza</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,Helvetica,sans-serif;
    touch-action:none;
}

#game{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#4f8a3f;
}

#world{
    position:absolute;
    left:0;
    top:0;

    width:2000px;
    height:2000px;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255,255,255,.03),
            transparent 20%
        ),
        radial-gradient(
            circle at 70% 60%,
            rgba(0,0,0,.05),
            transparent 25%
        ),
        #4f8a3f;
}

/* ===============================
PLAYER
=============================== */

#player{
    position:absolute;

    width:44px;
    height:44px;

    border-radius:50%;

    background:#f1c27d;

    border:4px solid #24351f;

    z-index:20;

    box-shadow:
        0 6px 12px rgba(0,0,0,.35);
}

#player::before{
    content:"";

    position:absolute;

    width:24px;
    height:14px;

    background:#2d6e37;

    border-radius:
        12px 12px 5px 5px;

    top:-9px;
    left:6px;
}


/* ===============================
RECURSOS
=============================== */

.resource{

    position:absolute;

    display:flex;

    align-items:center;
    justify-content:center;

    user-select:none;

}

.tree{

    width:64px;
    height:76px;

    font-size:58px;

}

.rock{

    width:56px;
    height:56px;

    font-size:48px;

}


/* ===============================
CONSTRUÇÃO
=============================== */

.building{

    position:absolute;

    z-index:8;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

}

.hut{

    width:110px;
    height:110px;

    font-size:90px;

}

.buildingLevel{

    position:absolute;

    bottom:-5px;

    background:rgba(0,0,0,.7);

    color:white;

    padding:4px 8px;

    border-radius:8px;

    font-size:11px;

}


/* ===============================
HUD
=============================== */

#hud{

    position:absolute;

    top:12px;
    left:12px;
    right:12px;

    z-index:100;

    display:flex;

    gap:8px;

    flex-wrap:wrap;

}

.hudItem{

    background:
        rgba(15,20,15,.88);

    color:white;

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius:12px;

    padding:10px 14px;

    font-weight:bold;

    font-size:14px;

    backdrop-filter:blur(4px);

}

#playerName{

    margin-left:auto;

}


/* ===============================
AÇÕES
=============================== */

#actionArea{

    position:absolute;

    right:18px;
    bottom:28px;

    z-index:120;

    display:flex;

    flex-direction:column;

    gap:10px;

}

.actionBtn{

    width:88px;
    height:70px;

    border-radius:18px;

    border:none;

    color:white;

    font-weight:bold;

    font-size:12px;

    box-shadow:
        0 10px 25px rgba(0,0,0,.35);

}

.actionBtn:active{

    transform:scale(.94);

}

#btnCollect{

    background:
        linear-gradient(
            145deg,
            #ff9f1c,
            #d97706
        );

}

#btnBuild{

    background:
        linear-gradient(
            145deg,
            #3d9b53,
            #236d36
        );

}


/* ===============================
JOYSTICK
=============================== */

#joystickBase{

    position:absolute;

    left:20px;
    bottom:30px;

    width:130px;
    height:130px;

    border-radius:50%;

    background:
        rgba(0,0,0,.25);

    border:
        2px solid
        rgba(255,255,255,.15);

    z-index:120;

    touch-action:none;

}

#joystickKnob{

    position:absolute;

    width:58px;
    height:58px;

    border-radius:50%;

    background:
        rgba(255,255,255,.45);

    left:36px;
    top:36px;

    box-shadow:
        0 4px 12px
        rgba(0,0,0,.3);

}


/* ===============================
MENSAGENS
=============================== */

#message{

    position:absolute;

    left:50%;

    bottom:190px;

    transform:
        translateX(-50%);

    background:
        rgba(0,0,0,.8);

    color:white;

    padding:10px 16px;

    border-radius:10px;

    font-size:13px;

    z-index:150;

    opacity:0;

    transition:.2s;

    pointer-events:none;

    text-align:center;

    max-width:80%;

}

#message.show{

    opacity:1;

}

#nearInfo{

    position:absolute;

    left:50%;

    top:75px;

    transform:
        translateX(-50%);

    background:
        rgba(0,0,0,.65);

    color:white;

    padding:8px 12px;

    border-radius:10px;

    font-size:12px;

    z-index:110;

    display:none;

}


/* ===============================
PAINEL CONSTRUÇÃO
=============================== */

#buildPanel{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:90%;

    max-width:340px;

    background:#131b15;

    border:
        1px solid #344438;

    border-radius:18px;

    padding:20px;

    z-index:300;

    display:none;

    color:white;

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.55);

}

#buildPanel.show{

    display:block;

}

#buildPanel h2{

    margin-bottom:6px;

}

.buildSubtitle{

    color:#92a096;

    font-size:13px;

    margin-bottom:18px;

}

.buildCard{

    background:#0d140f;

    border:
        1px solid #2f3e33;

    border-radius:14px;

    padding:15px;

}

.buildIcon{

    font-size:55px;

    text-align:center;

    margin-bottom:10px;

}

.buildCost{

    margin-top:10px;

    padding:10px;

    background:#151f17;

    border-radius:10px;

    font-size:13px;

    line-height:1.7;

}

.panelBtn{

    width:100%;

    min-height:50px;

    margin-top:10px;

    border:none;

    border-radius:11px;

    color:white;

    font-weight:bold;

    font-size:14px;

}

.confirmBuild{

    background:#299747;

}

.closePanel{

    background:#242d26;

}


/* ===============================
PAINEL BARRACA
=============================== */

#hutPanel{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:90%;

    max-width:340px;

    background:#131b15;

    border:
        1px solid #344438;

    border-radius:18px;

    padding:20px;

    z-index:310;

    display:none;

    color:white;

}

#hutPanel.show{

    display:block;

}

#hutPanel h2{

    margin-bottom:8px;

}

.incomeText{

    color:#83df96;

    margin-bottom:12px;

}

@media(max-width:400px){

    .hudItem{

        font-size:12px;

        padding:8px 10px;

    }

    #joystickBase{

        width:120px;
        height:120px;

    }

    #joystickKnob{

        left:31px;
        top:31px;

    }

    .actionBtn{

        width:80px;
        height:65px;

    }

}

</style>
</head>

<body>

<div id="game">

    <div id="world"></div>


    <!-- HUD -->

    <div id="hud">

        <div class="hudItem">
            🪵
            <span id="wood">0</span>
        </div>

        <div class="hudItem">
            🪨
            <span id="stone">0</span>
        </div>

        <div class="hudItem">
            🍖
            <span id="food">0</span>
        </div>

        <div class="hudItem">
            💰 R$
            <span id="money">100</span>
        </div>

        <div
        class="hudItem"
        id="playerName"
        >
            Jogador
        </div>

    </div>


    <div id="nearInfo"></div>


    <!-- JOYSTICK -->

    <div id="joystickBase">

        <div id="joystickKnob"></div>

    </div>


    <!-- BOTÕES -->

    <div id="actionArea">

        <button
        class="actionBtn"
        id="btnCollect"
        >
            COLETAR
        </button>

        <button
        class="actionBtn"
        id="btnBuild"
        >
            🏗️
            <br>
            CONSTRUIR
        </button>

    </div>


    <div id="message"></div>


    <!-- PAINEL CONSTRUÇÃO -->

    <div id="buildPanel">

        <h2>Construções</h2>

        <div class="buildSubtitle">
            Expanda sua base e comece seu império.
        </div>


        <div class="buildCard">

            <div class="buildIcon">
                🛖
            </div>

            <strong>
                Barraca de Sobrevivência
            </strong>

            <div class="buildCost">

                🪵 Madeira: 10
                <br>

                🪨 Pedra: 5
                <br><br>

                💰 Gera:
                R$ 2 a cada 5 segundos

            </div>


            <button
            class="panelBtn confirmBuild"
            id="buildHut"
            >
                CONSTRUIR BARRACA
            </button>

        </div>


        <button
        class="panelBtn closePanel"
        id="closeBuild"
        >
            FECHAR
        </button>

    </div>


    <!-- PAINEL BARRACA -->

    <div id="hutPanel">

        <h2>
            🛖 Barraca
        </h2>

        <div
        class="incomeText"
        id="hutIncome"
        >
            Renda: R$ 2 / 5 segundos
        </div>

        <div id="hutLevel">
            Nível 1
        </div>


        <div class="buildCost">

            Próxima melhoria:
            <br><br>

            🪵 15 Madeira
            <br>

            🪨 10 Pedra
            <br>

            💰 R$ 50

        </div>


        <button
        class="panelBtn confirmBuild"
        id="upgradeHut"
        >
            MELHORAR BARRACA
        </button>


        <button
        class="panelBtn closePanel"
        id="closeHut"
        >
            FECHAR
        </button>

    </div>


</div>



<script>

/* =============================
ELEMENTOS
============================= */

const game =
document.getElementById("game");

const world =
document.getElementById("world");

const woodEl =
document.getElementById("wood");

const stoneEl =
document.getElementById("stone");

const foodEl =
document.getElementById("food");

const moneyEl =
document.getElementById("money");

const btnCollect =
document.getElementById("btnCollect");

const btnBuild =
document.getElementById("btnBuild");

const nearInfo =
document.getElementById("nearInfo");

const message =
document.getElementById("message");

const joystickBase =
document.getElementById("joystickBase");

const joystickKnob =
document.getElementById("joystickKnob");

const buildPanel =
document.getElementById("buildPanel");

const hutPanel =
document.getElementById("hutPanel");


/* =============================
CONFIG
============================= */

const WORLD_SIZE = 2000;

const PLAYER_SIZE = 44;

const SPEED = 220;


/* =============================
STATUS JOGADOR
============================= */

let wood = 0;

let stone = 0;

let food = 0;

let money = 100;


/* =============================
BARRACA
============================= */

let hutBuilt = false;

let hutLevel = 0;

let hutIncome = 0;

let hutObject = null;


/* =============================
PLAYER
============================= */

let playerX =
WORLD_SIZE / 2;

let playerY =
WORLD_SIZE / 2;


let inputX = 0;

let inputY = 0;


let lastTime =
performance.now();


const player =
document.createElement("div");

player.id =
"player";

world.appendChild(player);


/* =============================
RECURSOS
============================= */

const resources = [];


function addResource(
type,
x,
y
){

    const el =
    document.createElement("div");

    el.classList.add(
        "resource"
    );


    let health = 1;


    if(type === "tree"){

        el.classList.add(
            "tree"
        );

        el.textContent =
            "🌲";

        health = 3;

    }


    if(type === "rock"){

        el.classList.add(
            "rock"
        );

        el.textContent =
            "🪨";

        health = 3;

    }


    el.style.left =
        x + "px";

    el.style.top =
        y + "px";


    world.appendChild(el);


    resources.push({

        type,
        x,
        y,
        el,
        health,
        active:true

    });

}



/* =============================
MAPA
============================= */

[
    [850,840],
    [960,760],
    [1080,900],
    [1180,780],
    [760,1020],
    [1040,1100],
    [1220,1040],
    [890,1170],
    [620,750],
    [1350,820],
    [700,1250],
    [1200,1320]

].forEach(
([x,y]) =>
addResource(
    "tree",
    x,
    y
)
);


[
    [700,850],
    [1140,1180],
    [1280,930],
    [920,980],
    [650,1150],
    [1350,1150]

].forEach(
([x,y]) =>
addResource(
    "rock",
    x,
    y
)
);


/* =============================
UTILIDADES
============================= */

function clamp(
value,
min,
max
){

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );

}


function distance(
ax,
ay,
bx,
by
){

    return Math.hypot(
        ax-bx,
        ay-by
    );

}


function updateHUD(){

    woodEl.textContent =
        wood;

    stoneEl.textContent =
        stone;

    foodEl.textContent =
        food;

    moneyEl.textContent =
        money;

}


function showMessage(text){

    message.textContent =
        text;

    message.classList.add(
        "show"
    );


    clearTimeout(
        showMessage.timer
    );


    showMessage.timer =
    setTimeout(()=>{

        message.classList.remove(
            "show"
        );

    },1400);

}


/* =============================
PLAYER
============================= */

function updatePlayer(){

    player.style.left =
        playerX + "px";

    player.style.top =
        playerY + "px";

}


/* =============================
CÂMERA
============================= */

function updateCamera(){

    const gameW =
        game.clientWidth;

    const gameH =
        game.clientHeight;


    let camX =
        gameW / 2 -
        playerX -
        PLAYER_SIZE / 2;


    let camY =
        gameH / 2 -
        playerY -
        PLAYER_SIZE / 2;


    camX =
    Math.min(
        0,
        Math.max(
            gameW -
            WORLD_SIZE,
            camX
        )
    );


    camY =
    Math.min(
        0,
        Math.max(
            gameH -
            WORLD_SIZE,
            camY
        )
    );


    world.style.transform =
    `translate(${camX}px,${camY}px)`;

}


/* =============================
RECURSO MAIS PRÓXIMO
============================= */

function getNearestResource(){

    let nearest =
        null;

    let nearestDist =
        Infinity;


    for(
        const res
        of resources
    ){

        if(
            !res.active
        ){
            continue;
        }


        const d =
        distance(
            playerX,
            playerY,
            res.x,
            res.y
        );


        if(
            d <
            nearestDist
        ){

            nearestDist =
                d;

            nearest =
                res;

        }

    }


    if(
        nearestDist <=
        90
    ){

        return nearest;

    }


    return null;

}


/* =============================
BARRACA PRÓXIMA
============================= */

function isNearHut(){

    if(
        !hutBuilt ||
        !hutObject
    ){

        return false;

    }


    const d =
    distance(

        playerX,
        playerY,

        hutObject.x,
        hutObject.y

    );


    return d <= 120;

}


/* =============================
INFO PRÓXIMA
============================= */

function updateNearby(){

    const res =
        getNearestResource();


    if(res){

        nearInfo.style.display =
            "block";


        if(
            res.type ===
            "tree"
        ){

            nearInfo.textContent =
                "🌲 Árvore próxima";

        }


        if(
            res.type ===
            "rock"
        ){

            nearInfo.textContent =
                "🪨 Pedra próxima";

        }


        return;

    }


    if(
        isNearHut()
    ){

        nearInfo.style.display =
            "block";

        nearInfo.textContent =
            "🛖 Sua barraca";

        return;

    }


    nearInfo.style.display =
        "none";

}


/* =============================
COLETA
============================= */

function collect(){

    const res =
        getNearestResource();


    if(!res){

        if(
            isNearHut()
        ){

            openHutPanel();

            return;

        }


        showMessage(
            "Chegue mais perto de um recurso."
        );

        return;

    }


    res.health--;


    if(
        res.type ===
        "tree"
    ){

        wood++;

        showMessage(
            "+1 madeira"
        );

    }


    if(
        res.type ===
        "rock"
    ){

        stone++;

        showMessage(
            "+1 pedra"
        );

    }


    updateHUD();


    if(
        res.health <= 0
    ){

        res.active =
            false;


        res.el.style.transition =
            ".25s";

        res.el.style.opacity =
            "0";

        res.el.style.transform =
            "scale(.3)";


        setTimeout(()=>{

            res.el.remove();

        },250);


        if(
            res.type ===
            "tree"
        ){

            showMessage(
                "Árvore coletada!"
            );

        }


        if(
            res.type ===
            "rock"
        ){

            showMessage(
                "Pedra coletada!"
            );

        }

    }

}


btnCollect.addEventListener(
"click",
collect
);


/* =============================
MENU CONSTRUÇÃO
============================= */

btnBuild.addEventListener(
"click",
()=>{

    buildPanel.classList.add(
        "show"
    );

});


document
.getElementById(
    "closeBuild"
)
.addEventListener(
"click",
()=>{

    buildPanel.classList.remove(
        "show"
    );

});


/* =============================
CRIAR BARRACA
============================= */

document
.getElementById(
    "buildHut"
)
.addEventListener(
"click",
()=>{


    if(hutBuilt){

        showMessage(
            "Você já possui uma barraca."
        );

        return;

    }


    if(
        wood < 10 ||
        stone < 5
    ){

        showMessage(
            "Você precisa de 10 madeira e 5 pedra."
        );

        return;

    }


    wood -= 10;

    stone -= 5;


    hutBuilt =
        true;

    hutLevel =
        1;

    hutIncome =
        2;


    createHut();


    updateHUD();


    buildPanel.classList.remove(
        "show"
    );


    showMessage(
        "Barraca construída!"
    );


});


function createHut(){

    const hut =
    document.createElement(
        "div"
    );


    hut.className =
        "building hut";


    hut.textContent =
        "🛖";


    const x =
        playerX + 100;

    const y =
        playerY - 50;


    hut.style.left =
        x + "px";

    hut.style.top =
        y + "px";


    const level =
    document.createElement(
        "div"
    );


    level.className =
        "buildingLevel";


    level.textContent =
        "Nível " +
        hutLevel;


    hut.appendChild(
        level
    );


    world.appendChild(
        hut
    );


    hutObject = {

        el:hut,

        levelEl:level,

        x,
        y

    };


    hut.addEventListener(
    "click",
    ()=>{

        openHutPanel();

    });


}


/* =============================
PAINEL BARRACA
============================= */

function openHutPanel(){

    if(
        !hutBuilt
    ){
        return;
    }


    document
    .getElementById(
        "hutLevel"
    )
    .textContent =
        "Nível " +
        hutLevel;


    document
    .getElementById(
        "hutIncome"
    )
    .textContent =
        "Renda: R$ " +
        hutIncome +
        " / 5 segundos";


    hutPanel.classList.add(
        "show"
    );

}


document
.getElementById(
    "closeHut"
)
.addEventListener(
"click",
()=>{

    hutPanel.classList.remove(
        "show"
    );

});


/* =============================
UPGRADE
============================= */

document
.getElementById(
    "upgradeHut"
)
.addEventListener(
"click",
()=>{


    if(
        hutLevel >= 2
    ){

        showMessage(
            "Nível máximo nesta versão."
        );

        return;

    }


    if(
        wood < 15 ||
        stone < 10 ||
        money < 50
    ){

        showMessage(
            "Recursos insuficientes."
        );

        return;

    }


    wood -= 15;

    stone -= 10;

    money -= 50;


    hutLevel =
        2;

    hutIncome =
        5;


    hutObject
    .levelEl
    .textContent =
        "Nível 2";


    updateHUD();


    openHutPanel();


    showMessage(
        "Barraca melhorada!"
    );


});


/* =============================
RENDA AUTOMÁTICA
============================= */

setInterval(()=>{

    if(
        !hutBuilt
    ){
        return;
    }


    money +=
        hutIncome;


    updateHUD();


},5000);


/* =============================
TECLADO
============================= */

const keys = {};


window.addEventListener(
"keydown",
(e)=>{

    keys[
        e.key.toLowerCase()
    ] = true;

});


window.addEventListener(
"keyup",
(e)=>{

    keys[
        e.key.toLowerCase()
    ] = false;

});


function updateKeyboardInput(){

    let x = 0;

    let y = 0;


    if(
        keys["w"] ||
        keys["arrowup"]
    ){
        y -= 1;
    }


    if(
        keys["s"] ||
        keys["arrowdown"]
    ){
        y += 1;
    }


    if(
        keys["a"] ||
        keys["arrowleft"]
    ){
        x -= 1;
    }


    if(
        keys["d"] ||
        keys["arrowright"]
    ){
        x += 1;
    }


    if(
        x !== 0 ||
        y !== 0
    ){

        const len =
        Math.hypot(
            x,
            y
        );


        inputX =
            x / len;

        inputY =
            y / len;

    }

}


/* =============================
JOYSTICK MOBILE
============================= */

let joystickActive =
    false;

let joystickPointerId =
    null;


function joystickMove(
clientX,
clientY
){

    const rect =
    joystickBase
    .getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    let dx =
        clientX -
        centerX;


    let dy =
        clientY -
        centerY;


    const max =
        42;


    const dist =
    Math.hypot(
        dx,
        dy
    );


    if(
        dist > max
    ){

        dx =
            dx /
            dist *
            max;


        dy =
            dy /
            dist *
            max;

    }


    joystickKnob
    .style
    .transform =
        `translate(${dx}px,${dy}px)`;


    inputX =
        dx / max;

    inputY =
        dy / max;

}


joystickBase
.addEventListener(
"pointerdown",
(e)=>{

    joystickActive =
        true;


    joystickPointerId =
        e.pointerId;


    joystickBase
    .setPointerCapture(
        e.pointerId
    );


    joystickMove(
        e.clientX,
        e.clientY
    );

});


joystickBase
.addEventListener(
"pointermove",
(e)=>{

    if(
        !joystickActive
    ){
        return;
    }


    if(
        e.pointerId !==
        joystickPointerId
    ){
        return;
    }


    joystickMove(
        e.clientX,
        e.clientY
    );

});


function stopJoystick(e){

    if(
        joystickPointerId !==
        null &&
        e.pointerId !==
        joystickPointerId
    ){

        return;

    }


    joystickActive =
        false;


    joystickPointerId =
        null;


    joystickKnob
    .style
    .transform =
        "translate(0px,0px)";


    inputX =
        0;

    inputY =
        0;

}


joystickBase
.addEventListener(
"pointerup",
stopJoystick
);


joystickBase
.addEventListener(
"pointercancel",
stopJoystick
);


/* =============================
LOOP
============================= */

function gameLoop(time){

    const delta =
    Math.min(
        (time-lastTime) /
        1000,
        .05
    );


    lastTime =
        time;


    if(
        !joystickActive
    ){

        inputX =
            0;

        inputY =
            0;


        updateKeyboardInput();

    }


    if(
        inputX !== 0 ||
        inputY !== 0
    ){

        const len =
        Math.hypot(
            inputX,
            inputY
        );


        if(
            len > 1
        ){

            inputX /=
                len;

            inputY /=
                len;

        }


        playerX +=
            inputX *
            SPEED *
            delta;


        playerY +=
            inputY *
            SPEED *
            delta;

    }


    playerX =
    clamp(
        playerX,
        0,
        WORLD_SIZE -
        PLAYER_SIZE
    );


    playerY =
    clamp(
        playerY,
        0,
        WORLD_SIZE -
        PLAYER_SIZE
    );


    updatePlayer();

    updateCamera();

    updateNearby();


    requestAnimationFrame(
        gameLoop
    );

}


/* =============================
INICIAR
============================= */

updateHUD();

updatePlayer();

updateCamera();


requestAnimationFrame(
    gameLoop
);


window.addEventListener(
"resize",
()=>{

    updateCamera();

});

</script>
